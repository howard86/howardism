<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <title>Howardism homepage tweaks</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    >
    <style>
    /* VOICE  editorial plates: the Howardism design system, unchanged — paper, ink, one terracotta brand, one hue per domain
   IDEA   a printed issue of a working wiki: masthead, "this issue" lead, an index of domains, the desk
   PICTURE the issue lead itself (sources → new + revised notes) is the picture
   COLOUR+TYPE tokens copied verbatim from packages/ui globals.css; Fraunces / Newsreader / JetBrains Mono
   LAYOUT PlatePage wide (1320) + gutter; tweaks panel docked right; every variant rendered below */
    :root {
      --background: oklch(0.965 0.012 82);
      --foreground: oklch(0.24 0.02 45);
      --foreground-subtle: oklch(0.53 0.015 55);
      --card: oklch(0.985 0.008 85);
      --muted: oklch(0.945 0.016 80);
      --muted-foreground: oklch(0.42 0.02 50);
      --border: oklch(0.85 0.018 70);
      --brand: oklch(0.55 0.155 35);
      --brand-soft: oklch(0.9 0.04 35);
      --domain-agent-systems: oklch(0.52 0.11 150);
      --domain-agent-security: oklch(0.51 0.13 356);
      --domain-ai-coding-practice: oklch(0.53 0.11 123);
      --domain-evals-and-benchmarks: oklch(0.52 0.09 172);
      --domain-model-capability-and-training: oklch(0.52 0.1 70);
      --domain-alignment-and-safety: oklch(0.5 0.12 333);
      --domain-interpretability: oklch(0.53 0.1 97);
      --domain-interaction-multimodal: oklch(0.56 0.15 35);
      --domain-formal-math: oklch(0.53 0.1 250);
      --domain-startup-founder: oklch(0.55 0.13 55);
      --domain-product-org: oklch(0.49 0.11 310);
      --domain-ai-economics-and-labor: oklch(0.52 0.13 20);
      --domain-superintelligence-trajectory: oklch(0.53 0.1 222);
      --domain-entities: oklch(0.5 0.11 290);
      --shadow-paper:
        0 1px 0 oklch(0.85 0.02 70 / 0.6),
        0 10px 30px -12px oklch(0.3 0.05 50 / 0.18);
      --display: "Fraunces", "Times New Roman", serif;
      --body: "Newsreader", Georgia, serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --gutter: clamp(20px, 5vw, 72px);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --background: oklch(0.18 0.015 260);
        --foreground: oklch(0.94 0.01 80);
        --foreground-subtle: oklch(0.62 0.015 70);
        --card: oklch(0.24 0.018 260);
        --muted: oklch(0.22 0.02 260);
        --muted-foreground: oklch(0.78 0.015 75);
        --border: oklch(0.35 0.02 260);
        --brand: oklch(0.74 0.13 40);
        --brand-soft: oklch(0.32 0.05 40);
        --domain-agent-systems: oklch(0.76 0.1 152);
        --domain-agent-security: oklch(0.74 0.12 358);
        --domain-ai-coding-practice: oklch(0.76 0.1 125);
        --domain-evals-and-benchmarks: oklch(0.75 0.09 174);
        --domain-model-capability-and-training: oklch(0.78 0.1 75);
        --domain-alignment-and-safety: oklch(0.73 0.11 335);
        --domain-interpretability: oklch(0.76 0.1 99);
        --domain-interaction-multimodal: oklch(0.74 0.13 40);
        --domain-formal-math: oklch(0.74 0.1 250);
        --domain-startup-founder: oklch(0.77 0.12 58);
        --domain-product-org: oklch(0.73 0.11 310);
        --domain-ai-economics-and-labor: oklch(0.74 0.12 22);
        --domain-superintelligence-trajectory: oklch(0.74 0.1 224);
        --domain-entities: oklch(0.72 0.11 290);
        --shadow-paper: 0 10px 30px -12px #0008;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --background: oklch(0.18 0.015 260);
      --foreground: oklch(0.94 0.01 80);
      --foreground-subtle: oklch(0.62 0.015 70);
      --card: oklch(0.24 0.018 260);
      --muted: oklch(0.22 0.02 260);
      --muted-foreground: oklch(0.78 0.015 75);
      --border: oklch(0.35 0.02 260);
      --brand: oklch(0.74 0.13 40);
      --brand-soft: oklch(0.32 0.05 40);
      --domain-agent-systems: oklch(0.76 0.1 152);
      --domain-agent-security: oklch(0.74 0.12 358);
      --domain-ai-coding-practice: oklch(0.76 0.1 125);
      --domain-evals-and-benchmarks: oklch(0.75 0.09 174);
      --domain-model-capability-and-training: oklch(0.78 0.1 75);
      --domain-alignment-and-safety: oklch(0.73 0.11 335);
      --domain-interpretability: oklch(0.76 0.1 99);
      --domain-interaction-multimodal: oklch(0.74 0.13 40);
      --domain-formal-math: oklch(0.74 0.1 250);
      --domain-startup-founder: oklch(0.77 0.12 58);
      --domain-product-org: oklch(0.73 0.11 310);
      --domain-ai-economics-and-labor: oklch(0.74 0.12 22);
      --domain-superintelligence-trajectory: oklch(0.74 0.1 224);
      --domain-entities: oklch(0.72 0.11 290);
      --shadow-paper: 0 10px 30px -12px #0008;
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      min-width: 0;
    }
    html {
      scroll-padding-top: 24px;
    }
    body {
      margin: 0;
      overflow-x: clip;
      font: 17px / 1.55 var(--body);
      color: var(--foreground);
      background: var(--background);
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    a:hover {
      color: var(--brand);
    }
    a:focus-visible,
    button:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
      border-radius: 2px;
    }
    .eb {
      font: 500 10.5px / 1.4 var(--mono);
      color: var(--foreground-subtle);
      text-transform: uppercase;
      letter-spacing: 0.22em;
    }
    .meta {
      font: 10.5px / 1.4 var(--mono);
      font-variant-numeric: tabular-nums;
      color: var(--foreground-subtle);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      white-space: nowrap;
    }
    .h2 {
      margin: 0;
      font: 400 clamp(30px, 4vw, 40px) / 1.04 var(--display);
      letter-spacing: -0.022em;
    }
    .h2 em {
      font-style: italic;
      font-weight: 300;
    }
    .lede {
      max-width: 620px;
      margin: 6px 0 0;
      font-size: 16px;
      line-height: 1.5;
      color: var(--muted-foreground);
    }
    .dot {
      display: inline-block;
      flex: none;
      margin-right: 8px;
      vertical-align: middle;
      border-radius: 50%;
    }
    .shell {
      max-width: 1320px;
      margin: 0 auto;
    }
    .gut {
      padding-inline: var(--gutter);
    }
    .band {
      padding-block: 36px;
      border-bottom: 1px solid var(--border);
    }
    .band.alt {
      background: var(--card);
    }
    /* DiscPageHeader full */
    .mast {
      padding-top: 28px;
    }
    .mast-rule {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 12px;
      font: 11px var(--mono);
      color: var(--foreground-subtle);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      border-bottom: 3px double var(--foreground);
    }
    .mast h1 {
      padding-top: 32px;
      margin: 0;
      font: 400 clamp(40px, 6vw, 72px) / 1.05 var(--display);
      letter-spacing: -0.03em;
      text-wrap: balance;
    }
    .mast h1 em {
      font-style: italic;
      color: var(--brand);
    }
    .dg {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 6px 16px;
      max-width: 520px;
      margin-top: 28px;
      font: 11px var(--mono);
      color: var(--foreground-subtle);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    .dg b {
      font: 400 15px var(--body);
      color: var(--muted-foreground);
      text-transform: none;
      letter-spacing: 0.02em;
    }
    .intro {
      max-width: 760px;
      margin: 24px 0 32px;
      font-size: clamp(16px, 2.2vw, 18.5px);
      color: var(--muted-foreground);
    }
    .issue-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 28px;
      align-items: baseline;
      margin-top: 28px;
    }
    .issue-line .big {
      font: 300 clamp(44px, 6vw, 64px) / 0.9 var(--display);
      color: var(--brand);
      letter-spacing: -0.04em;
    }
    .issue-line .big small {
      margin-left: 8px;
      font: 11px var(--mono);
      color: var(--foreground-subtle);
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }
    /* IndexRow */
    ol.rows {
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .ir {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 0 16px;
      align-items: baseline;
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }
    .ir.first {
      border-top-width: 2px;
    }
    .ir .num {
      font: 300 22px / 0.9 var(--display);
      letter-spacing: -0.03em;
    }
    .ir .t {
      font: 500 16px / 1.25 var(--display);
      letter-spacing: -0.012em;
    }
    .ir .r {
      display: flex;
      gap: 16px;
      align-items: baseline;
    }
    .badge {
      display: inline-block;
      padding: 3px 6px 2px;
      margin-left: 8px;
      font: 500 9.5px / 1 var(--mono);
      vertical-align: 2px;
      color: var(--brand);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      background: var(--brand-soft);
      border-radius: 3px;
    }
    @media (max-width: 640px) {
      .ir .dl {
        display: none;
      }
    }
    /* this-issue */
    .lead-grid {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 32px 44px;
    }
    @media (max-width: 900px) {
      .lead-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    .src {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
      gap: 8px 32px;
      padding: 18px 0;
      border-top: 1px solid var(--border);
    }
    .src:first-child {
      border-top: 2px solid var(--brand);
    }
    @media (max-width: 760px) {
      .src {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    .src .st {
      margin-top: 4px;
      font: 500 19px / 1.25 var(--display);
      letter-spacing: -0.01em;
    }
    .src .au {
      margin-top: 2px;
      font-size: 13.5px;
      font-style: italic;
      color: var(--foreground-subtle);
    }
    .newl {
      padding: 0;
      margin: 8px 0 0;
      list-style: none;
    }
    .newl li {
      padding: 3px 0;
      font: 500 16px / 1.3 var(--display);
    }
    .revl {
      margin: 0;
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--muted-foreground);
    }
    .revl a {
      border-bottom: 1px solid var(--border);
    }
    .revl .sep {
      margin: 0 6px;
      color: var(--border);
    }
    .more {
      min-height: 44px;
      padding: 12px 16px;
      margin-top: 14px;
      font: 11px var(--mono);
      color: var(--foreground);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      cursor: pointer;
      background: none;
      border: 1px solid var(--border);
      border-radius: 2px;
    }
    .more:hover {
      color: var(--brand);
      border-color: var(--brand);
    }
    .qa {
      padding: 16px 20px;
      margin-top: 28px;
      background: var(--muted);
      border-radius: 2px;
    }
    .qa ol {
      padding-left: 20px;
      margin: 10px 0 0;
    }
    .qa li {
      margin: 8px 0;
      font-size: 15px;
      line-height: 1.5;
    }
    .qa li a {
      display: block;
      margin-top: 2px;
      font: 11px var(--mono);
      color: var(--foreground-subtle);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    /* domain index */
    .dix {
      width: 100%;
      border-collapse: collapse;
    }
    .dix td {
      padding: 9px 12px 9px 0;
      vertical-align: middle;
      border-top: 1px solid var(--border);
    }
    .dix tr:first-child td {
      border-top: 2px solid var(--foreground);
    }
    .dix .dn {
      font: 400 19px / 1.2 var(--display);
      white-space: nowrap;
    }
    .dix .cnt {
      width: 64px;
      font: 300 28px / 1 var(--display);
      text-align: right;
      letter-spacing: -0.03em;
    }
    .dix .top {
      font: 500 15px / 1.3 var(--display);
    }
    @media (max-width: 820px) {
      .dix .hide-m {
        display: none;
      }
      .dix .dn {
        white-space: normal;
      }
    }
    .spark {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 26px;
    }
    .spark span {
      width: 7px;
      border-radius: 1px;
    }
    /* plates (D3b) */
    .plate {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr) 300px;
      gap: 32px 44px;
      align-items: start;
    }
    @media (max-width: 1100px) {
      .plate {
        grid-template-columns: 160px minmax(0, 1fr);
      }
      .plate aside {
        grid-column: 2;
      }
    }
    @media (max-width: 700px) {
      .plate {
        grid-template-columns: minmax(0, 1fr);
      }
      .plate aside {
        grid-column: auto;
      }
    }
    .plate .big {
      font: 300 96px / 0.86 var(--display);
      letter-spacing: -0.045em;
    }
    .plate aside {
      padding: 4px 0 0 20px;
      border-left: 2px solid;
    }
    /* cards (D3c) */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }
    .card {
      padding: 16px 18px;
      background: var(--card);
      border-top: 2px solid;
      border-radius: 2px;
      box-shadow: var(--shadow-paper);
    }
    .card .cn {
      font: 400 20px / 1.15 var(--display);
    }
    .card ul {
      padding: 0;
      margin: 10px 0 0;
      list-style: none;
    }
    .card li {
      padding: 5px 0;
      font: 500 14.5px / 1.3 var(--display);
      border-top: 1px solid var(--border);
    }
    /* desk */
    .desk {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0 24px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    @media (max-width: 1000px) {
      .desk {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 600px) {
      .desk {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    .desk li {
      padding: 12px 0;
      border-bottom: 1px dashed var(--border);
    }
    .desk .dt {
      margin-top: 4px;
      font: 500 15px / 1.25 var(--display);
    }
    .desk .da {
      margin-top: 2px;
      font-size: 12.5px;
      font-style: italic;
      color: var(--foreground-subtle);
    }
    .side {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 32px 44px;
    }
    @media (max-width: 900px) {
      .side {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    /* tweaks panel */
    #tw {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      width: 316px;
      max-height: calc(100vh - 32px);
      overflow: auto;
      font: 13px / 1.4 var(--body);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow:
        0 1px 0 var(--border),
        0 18px 50px -12px #0006;
    }
    #tw header {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    #tw .bd {
      padding: 6px 14px 12px;
    }
    #tw fieldset {
      padding: 8px 0;
      margin: 0;
      border: 0;
      border-bottom: 1px solid var(--border);
    }
    #tw legend {
      padding: 0;
      margin-bottom: 6px;
      font: 500 10px var(--mono);
      color: var(--foreground-subtle);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }
    #tw .seg {
      display: flex;
      gap: 4px;
    }
    #tw .seg label {
      position: relative;
      flex: 1;
    }
    #tw .seg input {
      position: absolute;
      opacity: 0;
    }
    #tw .seg span {
      display: block;
      min-height: 36px;
      padding: 7px 4px;
      font-size: 12.5px;
      line-height: 1.2;
      text-align: center;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 2px;
    }
    #tw .seg input:checked + span {
      color: var(--background);
      background: var(--foreground);
      border-color: var(--foreground);
    }
    #tw .seg input:focus-visible + span {
      outline: 2px solid var(--brand);
      outline-offset: 1px;
    }
    #tw select {
      width: 100%;
      min-height: 38px;
      padding: 7px;
      font: 15px var(--body);
      color: var(--foreground);
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: 2px;
    }
    #tw.min .bd {
      display: none;
    }
    #tw.min {
      width: auto;
    }
    @media (min-width: 1180px) {
      body:not(.twmin) .shell {
        margin-right: 340px;
      }
    }
    @media (max-width: 700px) {
      #tw {
        right: 8px;
        bottom: 8px;
        left: 8px;
        width: auto;
        max-height: 55vh;
      }
    }
    /* variant gallery */
    .gal {
      padding-top: 28px;
      padding-bottom: 120px;
      margin-top: 56px;
      border-top: 3px double var(--foreground);
    }
    .vrow {
      margin-top: 44px;
    }
    .vgrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr));
      gap: 20px;
      margin-top: 14px;
    }
    .vgrid.one {
      grid-template-columns: minmax(0, 1fr);
    }
    .frame {
      position: relative;
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: 3px;
    }
    .frame.on {
      outline: 2px solid var(--brand);
    }
    .frame > .fh {
      display: flex;
      gap: 8px;
      align-items: baseline;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .frame > .fh b {
      font: 500 14px var(--display);
    }
    .frame > .fh button {
      min-height: 32px;
      padding: 6px 10px;
      font: 10px var(--mono);
      color: var(--foreground);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      cursor: pointer;
      background: none;
      border: 1px solid var(--border);
      border-radius: 2px;
    }
    #tw header button {
      min-height: 32px;
      font: 11px var(--mono);
      color: var(--foreground-subtle);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      cursor: pointer;
      background: none;
      border: 0;
    }
    .frame .fb {
      position: relative;
      max-height: 560px;
      padding: 0 18px 18px;
      overflow: hidden;
    }
    .frame .fb::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 56px;
      pointer-events: none;
      content: "";
      background: linear-gradient(transparent, var(--background));
    }
    .frame.open .fb {
      max-height: none;
    }
    .frame.open .fb::after {
      display: none;
    }
    .frame .note {
      padding: 8px 14px;
      font-size: 13.5px;
      color: var(--muted-foreground);
      border-top: 1px dashed var(--border);
    }
    .frame .fb .band {
      padding-block: 20px;
    }
    .frame .fb .gut {
      padding-inline: 0;
    }
    .prov {
      max-width: 820px;
      font-size: 13.5px;
      color: var(--foreground-subtle);
    }
    @media (prefers-reduced-motion: no-preference) {
      .fade {
        animation: f 0.35s ease-out;
      }
      @keyframes f {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }
    }
    </style>
  </head>
  <body>
    <div class="shell">
      <div id="home"></div>
      <section aria-labelledby="galh" class="gal gut">
        <div class="eb" style="color:var(--brand)">Plate · ∞ · Workbench</div>
        <h2 class="h2" id="galh" style="margin-top:8px">
          Every variant, <em style="color:var(--brand)">side by side.</em>
        </h2>
        <p class="lede">
          Same issue, same data, each option of each decision. The outlined
          frame is the one the homepage above is using. “Use this” sets it.
        </p>
        <p class="prov" id="prov"></p>
        <div id="gallery"></div>
      </section>
    </div>

    <aside aria-label="Tweaks" id="tw">
      <header>
        <span class="eb" style="color:var(--foreground)">Tweaks</span
        ><button aria-expanded="true" id="twmin" type="button">Hide</button>
      </header>
      <div class="bd" id="twbd"></div>
    </aside>

    <script>
    "use strict";
    const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;
    const DECISION_ID = /^d\d$/;
    (() => {
      const D = { notes: {}, issues: [], sources: {} };
      const SITE = "https://www.howard86.com";
      const DOMAINS = [
        "agent-systems",
        "agent-security",
        "ai-coding-practice",
        "evals-and-benchmarks",
        "model-capability-and-training",
        "alignment-and-safety",
        "interpretability",
        "interaction-multimodal",
        "formal-math",
        "startup-founder",
        "product-org",
        "ai-economics-and-labor",
        "superintelligence-trajectory",
        "entities",
      ];
      const LABEL = {
        "agent-systems": "Agent Systems",
        "agent-security": "Agent Security",
        "ai-coding-practice": "AI Coding Practice",
        "evals-and-benchmarks": "Evals & Benchmarks",
        "model-capability-and-training": "Model Capability & Training",
        "alignment-and-safety": "Alignment & Safety",
        interpretability: "Interpretability",
        "interaction-multimodal": "Interaction & Multimodal",
        "formal-math": "Formal Math",
        "startup-founder": "Startup & Founder",
        "product-org": "Product & Org",
        "ai-economics-and-labor": "AI Economics & Labor",
        "superintelligence-trajectory": "Superintelligence Trajectory",
        entities: "Entities",
      };
      const BLURB = {
        "agent-systems":
          "Agent harnesses, loop engineering, and scaffolding for LLM systems.",
        "agent-security":
          "Prompt injection, agent identity, and securing autonomous agents.",
        "ai-coding-practice":
          "Workflow, review discipline, and verification practice for AI-native teams.",
        "evals-and-benchmarks":
          "Benchmark design, contamination, LLM judges, and measuring capability.",
        "model-capability-and-training":
          "Training, scaling laws, test-time compute, and frontier capability.",
        "alignment-and-safety":
          "Alignment training, misalignment evals, and reward hacking.",
        interpretability:
          "Reading model internals: activations and the global workspace.",
        "interaction-multimodal":
          "Real-time, multimodal, full-duplex, and human-AI collaboration.",
        "formal-math": "Proof search, Lean, and verifier-driven mathematics.",
        "startup-founder":
          "Building AI-native companies: speed, moats, and lifecycle.",
        "product-org": "Product cadence, org design, and the AI-native team.",
        "ai-economics-and-labor":
          "Work, wages, org design, and the economics of AI-driven labor.",
        "superintelligence-trajectory":
          "Recursive self-improvement, scaling limits, and the path to ASI.",
        entities: "Profiles of the people, labs, products, and projects.",
      };
      const DECISIONS = [
        {
          id: "d1",
          name: "D1 Header / cadence",
          opts: { a: "Weekly issue", b: "Batched, honest", c: "Current" },
        },
        {
          id: "d2",
          name: "D2 “This issue” lead",
          opts: { a: "By source", b: "Flat feed", c: "Hidden" },
        },
        {
          id: "d3",
          name: "D3 Domain section",
          opts: { a: "Compact index", b: "Touched plates", c: "Card grid" },
        },
        {
          id: "d4",
          name: "D4 Note dates",
          opts: { a: "Filed · revised", b: "Revised + New", c: "Created only" },
        },
        {
          id: "d5",
          name: "D5 Questions answered",
          opts: { a: "Count + list", b: "Count in header", c: "Omit" },
        },
        {
          id: "d6",
          name: "D6 Desk",
          opts: { a: "Recent sources", b: "Top 24 cited", c: "Link to /shelf" },
        },
      ];
      const DEF = { d1: "c", d2: "c", d3: "b", d4: "c", d5: "c", d6: "b" };
      const PICK = { d1: "b", d2: "a", d3: "b", d4: "b", d5: "b", d6: "a" };
      let S = { ...PICK, issue: null };
      try {
        Object.assign(
          S,
          JSON.parse(localStorage.getItem("hw-tweaks-2") || "{}")
        );
      } catch {
        // Unreadable saved tweaks: keep the defaults.
      }
      const save = () => {
        try {
          localStorage.setItem("hw-tweaks-2", JSON.stringify(S));
        } catch {
          // Storage unavailable: the tweaks just don't persist.
        }
      };

      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
        );
      const col = (d) => `var(--domain-${d})`;
      const MON = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];
      const pd = (s) => new Date(`${s}T00:00:00Z`);
      const fmt = (s, yr) => {
        if (!s) {
          return "";
        }
        const d = pd(s);
        return (
          `${d.getUTCDate()} ${MON[d.getUTCMonth()]}` +
          (yr ? ` ${d.getUTCFullYear()}` : "")
        );
      };
      const dot = (d, n = 7) =>
        `<span class="dot" aria-hidden="true" style="background:${col(d)};width:${n}px;height:${n}px"></span>`;
      const dlabel = (d) => `${dot(d, 6)}${esc(LABEL[d])}`;
      const href = (s) => `${SITE}/articles/${s}`;
      const pl = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
      const pubDate = (p) => {
        if (!p) {
          return "";
        }
        return ISO_DATE.test(p) ? fmt(p, true) : p;
      };
      const WEEK_MS = 7 * 864e5;
      function tally(b, slug, n, at, t0) {
        b.count += 1;
        b.notes.push(slug);
        const evs = [n.seen, ...n.revs.filter((x) => x <= at && x > n.seen)];
        for (const e of evs) {
          const w = 7 - Math.floor((t0 - pd(e).getTime()) / WEEK_MS);
          if (w >= 0 && w < 8) {
            b.bars[w] += 1;
            b.hot[slug] = (b.hot[slug] || 0) + 1;
          }
        }
      }

      /* ---- state for one issue ---- */
      function ctx(no) {
        const iss = D.issues.find((i) => i.no === no) || D.issues.at(-1);
        const at = iss.date,
          isNew = new Set(iss.new),
          isRev = new Set(iss.rev);
        const live = Object.entries(D.notes).filter(([, n]) => n.seen <= at);
        const rev = (n) => {
          let r = null;
          for (const x of n.revs) {
            if (x <= at && x > n.seen) {
              r = x;
            }
          }
          return r;
        };
        const act = (n) => rev(n) || n.seen;
        const t0 = pd(at).getTime();
        const byDom = {};
        for (const d of DOMAINS) {
          byDom[d] = {
            count: 0,
            notes: [],
            bars: new Array(8).fill(0),
            last: null,
            hot: {},
          };
        }
        for (const [slug, n] of live) {
          const b = byDom[n.d];
          if (!b) {
            continue;
          }
          tally(b, slug, n, at, t0);
          const r = rev(n);
          if (r && (!b.last || r > b.last)) {
            b.last = r;
          }
        }
        for (const d of DOMAINS) {
          const b = byDom[d];
          b.notes.sort(
            (x, y) =>
              act(D.notes[y]).localeCompare(act(D.notes[x])) ||
              D.notes[x].t.localeCompare(D.notes[y].t)
          );
          b.byFiled = b.notes
            .slice()
            .sort((x, y) => D.notes[y].f.localeCompare(D.notes[x].f));
          b.top =
            Object.entries(b.hot).sort(
              (x, y) =>
                y[1] - x[1] ||
                act(D.notes[y[0]]).localeCompare(act(D.notes[x[0]]))
            )[0]?.[0] || b.notes[0];
          b.touched = b.notes.some((s) => isNew.has(s) || isRev.has(s));
        }
        const total = live.length;
        const recentIss = D.issues.filter((i) => i.no <= iss.no).slice(-3);
        return { iss, at, isNew, isRev, rev, byDom, total, recentIss };
      }

      /* ---- IndexRow with D4 date modes ---- */
      function dateCell(C, slug) {
        const n = D.notes[slug],
          r = C.rev(n);
        if (S.d4 === "a") {
          return `filed ${fmt(n.f)}${r ? ` · rev. ${fmt(r)}` : ""}`;
        }
        if (S.d4 === "b") {
          return fmt(r || n.f);
        }
        return fmt(n.f, true);
      }
      function row(C, slug, i, accent, opt = {}) {
        const n = D.notes[slug];
        if (!n) {
          return "";
        }
        const badge =
          S.d4 === "b" && C.isNew.has(slug)
            ? `<span class="badge">New</span>`
            : "";
        return `<li class="ir${i === 0 ? " first" : ""}" style="${i === 0 ? `border-top-color:${accent}` : ""}">
    <span class="num" style="color:${accent}">${opt.prefix || ""}${String(i + 1).padStart(2, "0")}</span>
    <div><a class="t" href="${href(slug)}">${esc(n.t)}</a>${badge}</div>
    <div class="r">${opt.domain === false ? "" : `<span class="meta dl">${dlabel(n.d)}</span>`}<span class="meta">${dateCell(C, slug)} · ${n.r}′</span></div></li>`;
      }
      const spark = (bars, c) => {
        const p = Math.max(1, ...bars);
        return `<div class="spark" aria-hidden="true">${bars.map((v, i) => `<span style="background:${c};height:${Math.max(4, (v / p) * 26)}px;opacity:${i >= 5 ? 1 : 0.4}"></span>`).join("")}</div>`;
      };
      const srcMeta = (t) => D.sources[t] || {};
      const qCount = (C) => C.iss.resolved.length;

      /* ---- D1 header ---- */
      function header(C, v) {
        const i = C.iss;
        const { prev } = i;
        const d0 = pd(i.date);
        const wk = new Date(d0.getTime() - d0.getUTCDay() * 864e5)
          .toISOString()
          .slice(0, 10);
        const nextSun = new Date(d0.getTime() + (7 - d0.getUTCDay()) * 864e5)
          .toISOString()
          .slice(0, 10);
        let data,
          line = "",
          intro;
        const q =
          S.d5 === "b"
            ? [
                [
                  "Answered",
                  `${pl(qCount(C), "question")} this issue · ${i.open ?? "—"} still open`,
                ],
              ]
            : [];
        if (v === "a") {
          data = [
            ["Issue", `No. ${i.no} · week of ${fmt(wk, true)}`],
            ["Next issue", `Sunday, ${fmt(nextSun)}`],
            ...q,
            ["Curator", "Howard Tai"],
            ["Based", "Taiwan, 23°N"],
          ];
          intro =
            "Working notes on interaction-era AI, kept publicly. Each issue folds a week of reading into the wiki: a few new notes, and many older ones rewritten to agree with them.";
        } else if (v === "b") {
          line = `<div class="issue-line"><span class="big">${i.new.length}<small>new</small></span><span class="big">${i.rev.length}<small>revised</small></span><span class="meta" style="font-size:11px">Released ${fmt(i.date, true)} · since ${fmt(prev, true)}</span></div>`;
          data = [
            ...q,
            ["Curator", "Howard Tai"],
            ["Cadence", "Batched, not scheduled"],
            ["Based", "Taiwan, 23°N"],
          ];
          intro =
            "Working notes on interaction-era AI, kept publicly. A release lands when a batch of sources is finished. Most of the work is revision: each source adds about one note and rewrites a dozen that it touches.";
        } else {
          data = [
            ["Curator", "Howard Tai"],
            ["Issue", `Vol. 03 · no. ${C.total}`],
            ["Cadence", "Batched, not scheduled"],
            ...q,
            ["Based", "Taiwan, 23°N"],
            ["Contact", "howard@howardism.dev"],
          ];
          intro = `Working notes on interaction-era AI, kept publicly. Each plate is a domain; each domain carries its brightest notes and the source I'm currently digesting. ${C.total} notes across ${i.srcTotal} sources, last filed ${fmt(i.date, true)}. Updated whenever a batch finishes — not on a schedule.`;
        }
        let end = "Masthead · No. 00";
        if (v === "a") {
          end = `Issue ${i.no} · ${fmt(i.date)}`;
        } else if (v === "b") {
          end = `Release · ${fmt(i.date, true)}`;
        }
        return `<section class="mast gut"><div class="mast-rule"><span>Howardism · Vol. 03</span><span>${end}</span></div>
    <h1>A wiki, set <em>in plates.</em></h1>${line}
    <div class="dg">${data.map(([k, x]) => `<span>${k}</span><b>${esc(x)}</b>`).join("")}</div>
    <p class="intro">${intro}</p></section>`;
      }

      /* ---- D2 this issue ---- */
      const LIMIT = { groups: 6, flatNew: 12, flatRev: 20 };
      function revList(C, slugs, max) {
        const shown = slugs.slice(0, max),
          rest = slugs.length - shown.length;
        return `<p class="revl">${shown.map((s) => `${dot(D.notes[s].d, 6)}<a href="${href(s)}">${esc(D.notes[s].t)}</a>`).join('<span class="sep">/</span>')}${rest > 0 ? `<span class="sep">/</span><span class="meta">+${rest} more</span>` : ""}</p>`;
      }
      function srcHead(g, m, when) {
        return `<article class="src"><div><div class="meta">${esc(m.kind || "Source")}${when ? ` · ${esc(when)}` : ""}${m.refs ? ` · ${m.refs} refs` : ""}</div>
        <div class="st">${m.url ? `<a href="${esc(m.url)}" rel="noopener noreferrer" target="_blank">${esc(g.src)}</a>` : esc(g.src)}</div>${m.author ? `<div class="au">${esc(m.author.length > 70 ? `${m.author.split(",")[0]} et al.` : m.author)}</div>` : ""}</div>`;
      }
      function srcNotes(C, g, full) {
        return `${g.new.length ? `<div class="meta">Filed · ${g.new.length}</div><ul class="newl">${g.new.map((s) => `<li>${dot(D.notes[s].d)}<a href="${href(s)}">${esc(D.notes[s].t)}</a></li>`).join("")}</ul>` : ""}
        ${g.rev.length ? `<div class="meta" style="margin-top:${g.new.length ? 12 : 0}px">Revised · ${g.rev.length}</div>${revList(C, g.rev, full ? 999 : 10)}` : ""}`;
      }
      function srcCard(C, g, full) {
        const m = srcMeta(g.src),
          when = pubDate(m.published);
        return `${srcHead(g, m, when)}
        <div>${srcNotes(C, g, full)}</div></article>`;
      }
      function groupedBody(C, i, full) {
        const gs = i.groups.filter((g) => g.src),
          up = i.groups.find((g) => !g.src);
        const lim = full ? gs.length : LIMIT.groups;
        let body = gs
          .slice(0, lim)
          .map((g) => srcCard(C, g, full))
          .join("");
        if (!full && gs.length > lim) {
          body += `<button class="more" type="button" data-more="groups">All ${gs.length} sources this issue →</button>`;
        }
        if (up) {
          body += `<article class="src" style="border-top-style:dashed"><div><div class="meta">No new source</div><div class="st">Upkeep</div><div class="au">Rewritten for links, merges and corrections, not traceable to one source.</div></div><div><div class="meta">Revised · ${up.rev.length}</div>${revList(C, up.rev, full ? 999 : 12)}</div></article>`;
        }
        return body;
      }
      function flatBody(C, i, full) {
        const nl = full ? i.new : i.new.slice(0, LIMIT.flatNew),
          rl = full ? i.rev : i.rev.slice(0, LIMIT.flatRev);
        const sortAct = (a) =>
          a.slice().sort((x, y) => D.notes[x].d.localeCompare(D.notes[y].d));
        return `<div class="meta" style="margin-bottom:8px">New · ${i.new.length}</div><ol class="rows">${sortAct(
          nl
        )
          .map((s, k) => row(C, s, k, "var(--brand)", { prefix: "N" }))
          .join("")}</ol>
      ${!full && i.new.length > nl.length ? `<button class="more" type="button" data-more="flat">All ${i.new.length} new and ${i.rev.length} revised →</button>` : ""}
      <div class="meta" style="margin:28px 0 8px">Revised · ${i.rev.length}</div><ol class="rows">${sortAct(
        rl
      )
        .map((s, k) =>
          row(C, s, k, "var(--foreground-subtle)", { prefix: "R" })
        )
        .join("")}</ol>`;
      }
      function issueLead(C, v, full) {
        if (v === "c") {
          return "";
        }
        const i = C.iss;
        const head = `<div><div class="eb" style="color:var(--brand)">Plate · ${String(i.no).padStart(2, "0")}</div>
    <h2 class="h2" style="margin-top:8px">This <em style="color:var(--brand)">issue.</em></h2>
    <p class="lede" style="font-size:15px">${v === "a" ? "What each source changed. One source usually files a note and rewrites the ones it touches." : "Everything that changed, newest work first."}</p>
    <dl class="dg" style="grid-template-columns:auto 1fr;margin-top:14px"><span>New</span><b>${i.new.length}</b><span>Revised</span><b>${i.rev.length}</b>${v === "a" ? `<span>Sources</span><b>${i.groups.filter((g) => g.src).length}</b>` : ""}</dl></div>`;
        const body = v === "a" ? groupedBody(C, i, full) : flatBody(C, i, full);
        return `<section class="band gut fade"><div class="lead-grid">${head}<div>${body}${S.d5 === "a" ? answered(C) : ""}</div></div></section>`;
      }
      function answered(C) {
        const r = C.iss.resolved;
        if (!r.length) {
          return `<div class="qa"><div class="eb">Questions answered · 0</div><p class="revl" style="margin-top:6px">None closed this issue. ${C.iss.open ?? ""} still open on <a href="${SITE}/questions">the questions plate</a>.</p></div>`;
        }
        return `<div class="qa"><div class="eb">Questions answered · ${r.length}</div><ol>${r
          .slice(0, 3)
          .map(
            (q) =>
              `<li>${esc(q.q)}<a href="${href(q.slug)}">${dot(q.d, 6)}${esc(q.title)} →</a></li>`
          )
          .join(
            ""
          )}</ol>${r.length > 3 ? `<a class="meta" href="${SITE}/questions">+${r.length - 3} more · ${C.iss.open} still open →</a>` : `<a class="meta" href="${SITE}/questions">${C.iss.open} still open →</a>`}</div>`;
      }

      /* ---- D3 domains ---- */
      function domains(C, v) {
        const ds = DOMAINS.filter((d) => C.byDom[d].count > 0);
        if (v === "a") {
          return `<section class="band gut"><div class="side"><div><div class="eb">Plate · II</div><h2 class="h2" style="margin-top:8px">The <em style="color:var(--brand)">domains.</em></h2><p class="lede" style="font-size:15px">Bars are 8 weeks of new and revised notes; the last three weeks in full colour.</p></div>
      <table class="dix"><tbody>${ds
        .map((d) => {
          const b = C.byDom[d];
          return `<tr><td class="dn"><a href="${SITE}/articles/domain/${d}">${dot(d)}${esc(LABEL[d])}</a></td>
      <td class="cnt" style="color:${col(d)}">${b.count}</td><td style="width:96px">${spark(b.bars, col(d))}</td>
      <td class="meta hide-m" style="width:110px">${b.last ? `rev. ${fmt(b.last)}` : "—"}</td>
      <td class="top hide-m"><a href="${href(b.top)}">${esc(D.notes[b.top].t)}</a></td></tr>`;
        })
        .join("")}</tbody></table></div></section>`;
        }
        if (v === "c") {
          return `<section class="band gut"><div class="eb">Plate · II</div><h2 class="h2" style="margin:8px 0 20px">The <em style="color:var(--brand)">domains.</em></h2>
      <div class="cards">${ds
        .map((d) => {
          const b = C.byDom[d];
          return `<div class="card" style="border-top-color:${col(d)}"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px"><div><a class="cn" href="${SITE}/articles/domain/${d}">${esc(LABEL[d])}</a><div class="meta" style="margin-top:4px">${b.count} notes${b.last ? ` · rev. ${fmt(b.last)}` : ""}</div></div>${spark(b.bars, col(d))}</div>
      <ul>${(S.d4 === "c" ? b.byFiled : b.notes)
        .slice(0, 2)
        .map((s) => `<li><a href="${href(s)}">${esc(D.notes[s].t)}</a></li>`)
        .join("")}</ul></div>`;
        })
        .join("")}</div></section>`;
        }
        const touched = ds.filter((d) => C.byDom[d].touched);
        const untouched = ds.filter((d) => !C.byDom[d].touched);
        return (
          touched
            .map((d, k) => {
              const b = C.byDom[d],
                c = col(d);
              const [g] = C.iss.groups
                .filter((grp) => grp.src)
                .map((grp) => [
                  grp,
                  [...grp.new, ...grp.rev].filter((s) => D.notes[s]?.d === d)
                    .length,
                ])
                .sort((x, y) => y[1] - x[1]);
              const m = g?.[1] ? srcMeta(g[0].src) : null;
              return `<section class="band gut${k % 2 ? " alt" : ""}"><div class="plate"><div><div class="eb" style="color:${c}">Plate · ${String(k + 1).padStart(2, "0")}</div><div class="big" style="color:${c};margin-top:8px">${b.count}</div>
      <div class="meta" style="margin-top:4px;letter-spacing:.14em">filed under ${esc(LABEL[d].toLowerCase())}</div><div style="margin-top:14px">${spark(b.bars, c)}<div class="meta" style="font-size:9.5px;margin-top:6px">Activity · 8 wks</div></div></div>
      <div><h2 class="h2">${esc(LABEL[d])}, <em style="color:${c}">in order.</em></h2><p class="lede">${esc(BLURB[d])}</p>
      <ol class="rows" style="margin-top:20px">${(S.d4 === "c"
        ? b.byFiled
        : b.notes
      )
        .slice(0, 4)
        .map((s, i) => row(C, s, i, c, { domain: false }))
        .join("")}
      <li style="border-top:1px solid var(--border);padding:10px 0"><a class="meta" style="color:${c};border-bottom:1px solid currentColor;letter-spacing:.18em" href="${SITE}/articles/domain/${d}">All ${b.count} notes in ${esc(LABEL[d].toLowerCase())} →</a></li></ol></div>
      ${m ? `<aside style="border-left-color:${c}"><div class="meta" style="letter-spacing:.18em">Sourced from · ${esc(m.kind)} · this issue</div><div class="st" style="font:500 18px/1.25 var(--display);margin-top:6px">${m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">${esc(g[0].src)}</a>` : esc(g[0].src)}</div><div class="meta" style="color:${c};margin-top:14px">● ${pl(g[1], "note")} touched here</div></aside>` : "<aside style='border:0'></aside>"}</div></section>`;
            })
            .join("") +
          (untouched.length
            ? `<section class="band gut"><div class="eb">Quiet this issue</div><ul style="list-style:none;margin:16px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:12px 32px">${untouched.map((d) => `<li><a href="${SITE}/articles/domain/${d}" style="font:400 20px var(--display)">${dot(d)}${esc(LABEL[d])}<span class="meta" style="margin-left:8px">${C.byDom[d].count}</span></a></li>`).join("")}</ul></section>`
            : "")
        );
      }

      /* ---- D6 desk ---- */
      function desk(C, v) {
        const i = C.iss;
        if (v === "c") {
          return `<section class="band gut"><div class="side"><div><div class="eb" style="color:var(--brand)">Plate · ∞</div></div><a href="${SITE}/shelf" style="font:400 clamp(26px,3.4vw,34px)/1.1 var(--display)">The desk has moved to <em style="color:var(--brand)">the shelf</em> — ${i.srcTotal} sources →</a></div></section>`;
        }
        let list, blurb;
        if (v === "a") {
          const seen = new Map();
          for (const is of C.recentIss.slice().reverse()) {
            for (const g of is.groups) {
              if (g.src && !seen.has(g.src)) {
                seen.set(g.src, {
                  n: g.new.length + g.rev.length,
                  no: is.no,
                  date: is.date,
                });
              }
            }
          }
          list = [...seen.entries()].slice(0, 24).map(([t, x]) => ({
            t,
            line: `Issue ${x.no} · ${pl(x.n, "note")}`,
          }));
          blurb = `Sources processed in the last ${C.recentIss.length} issues (${seen.size} in all), newest first.`;
        } else {
          list = i.desk.map((s) => ({ t: s.title, line: `${s.refs} refs` }));
          blurb =
            "The sources behind the wiki, ranked by how often they're cited.";
        }
        return `<section class="band gut"><div class="side"><div><div class="eb" style="color:var(--brand)">Plate · ∞</div><h2 class="h2" style="margin-top:8px">The <em style="color:var(--brand)">desk.</em></h2><p class="lede" style="font-size:15px;max-width:200px">${blurb}</p>
    <dl class="dg" style="margin-top:14px;max-width:200px">${Object.entries(
      i.kinds
    )
      .map(([k, n]) => `<span>${esc(k)}</span><b>${n}</b>`)
      .join("")}</dl></div>
    <ul class="desk">${list
      .map((s) => {
        const m = srcMeta(s.t);
        const when = pubDate(m.published);
        return `<li><div class="meta" style="font-size:9.5px;letter-spacing:.16em">${esc(m.kind || "Source")}${when ? ` · ${esc(when)}` : ""} · ${esc(s.line)}</div><div class="dt">${m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">${esc(s.t)}</a>` : esc(s.t)}</div>${m.author ? `<div class="da">${esc(m.author.split(",").length > 2 ? `${m.author.split(",")[0]} et al.` : m.author)}</div>` : ""}</li>`;
      })
      .join("")}</ul></div></section>`;
      }

      /* ---- assemble ---- */
      function page(C, o, full) {
        return (
          header(C, o.d1) +
          issueLead(C, o.d2, full) +
          domains(C, o.d3) +
          desk(C, o.d6)
        );
      }
      const NOTES = {
        d1: {
          a: (C) =>
            `Cadence check: the last six releases came ${gaps(C)} days apart, so “next issue Sunday” would promise more than the history shows.`,
          b: (C) =>
            `Numbers come straight from the release diff (content changes only; frontmatter-only edits don't count).`,
          c: () =>
            "Live today. “Issue no.” is the running note count, not an issue number.",
        },
        d2: {
          a: (C) =>
            `${C.iss.groups.filter((g) => g.src).length} sources this issue. Each revised note is filed under the source it gained; ${C.iss.groups.find((g) => !g.src)?.rev.length || 0} revisions gained no source and sit in Upkeep.`,
          b: () =>
            "Grouped by domain inside each list so colour runs together.",
          c: () => "Control: today's page.",
        },
        d3: {
          a: () =>
            "All 14 domains in one table; sparkline counts new + revised.",
          b: (C) =>
            `${DOMAINS.filter((d) => C.byDom[d].touched).length} of 14 domains touched this issue get a plate.`,
          c: () => "Same facts as the index, but two notes per domain.",
        },
        d4: {
          a: () => "Revised shows only when the body changed after filing.",
          b: () =>
            "Date is the last revision; New marks notes first released in this issue.",
          c: () => "Live today.",
        },
        d5: {
          a: (C) =>
            `${C.iss.resolved.length} resolved this issue (from the vault's Resolved Questions sections).`,
          b: () => "Shown as one row in the header data.",
          c: () => "",
        },
        d6: {
          a: () => "Union of sources processed in the last three releases.",
          b: () => "Live today.",
          c: () => "",
        },
      };
      function gaps(C) {
        const xs = D.issues.filter((i) => i.no <= C.iss.no).slice(-7);
        const g = [];
        for (let k = 1; k < xs.length; k += 1) {
          g.push(Math.round((pd(xs[k].date) - pd(xs[k - 1].date)) / 864e5));
        }
        return g.join(", ");
      }
      const FRAG = {
        d1: (C, v) => header(C, v),
        d2: (C, v) =>
          v === "c"
            ? `<p class="lede" style="padding:20px 0">Hidden. The page opens straight onto the domains.</p>`
            : issueLead(C, v, false),
        d3: (C, v) => domains(C, v),
        d4: (C) => {
          const d = C.byDom["agent-systems"];
          const pick = [
            ...C.iss.new
              .filter((s) => D.notes[s].d === "agent-systems")
              .slice(0, 2),
            ...C.iss.rev
              .filter((s) => D.notes[s].d === "agent-systems")
              .slice(0, 2),
            ...d.notes
              .filter((s) => !(C.isNew.has(s) || C.isRev.has(s)))
              .slice(0, 1),
          ];
          return `<ol class="rows" style="margin-top:18px">${pick.map((s, i) => row(C, s, i, col("agent-systems"), { domain: false })).join("")}</ol>`;
        },
        d5: (C, v) => {
          if (v === "a") {
            return answered(C);
          }
          if (v === "b") {
            return `<div class="dg" style="margin-top:18px"><span>Answered</span><b>${pl(qCount(C), "question")} this issue · ${C.iss.open} still open</b></div>`;
          }
          return `<p class="lede" style="padding:20px 0">Omitted.</p>`;
        },
        d6: (C, v) => desk(C, v),
      };
      function frag(C, id, v) {
        const saved = S;
        S = { ...S, [id]: v };
        const h = FRAG[id](C, v);
        S = saved;
        return h;
      }
      function render() {
        const C = ctx(S.issue);
        S.issue = C.iss.no;
        document.getElementById("home").innerHTML = page(C, S, false);
        document.getElementById("prov").innerHTML =
          `Data: issue ${C.iss.no}, released ${fmt(C.iss.date, true)} (commit ${C.iss.hash}). Real releases from the howard86/howardism history — note titles, domains, filed dates, content revisions, the sources each note gained, and resolved questions. The repo stopped carrying content after the ${fmt(D.issues.at(-1).date, true)} release; later releases live in the private R2 bucket.`;
        document.getElementById("gallery").innerHTML = DECISIONS.map(
          (
            dc
          ) => `<div class="vrow"><div class="eb" style="color:var(--foreground)">${esc(dc.name)}</div>
    <div class="vgrid${["d2", "d3"].includes(dc.id) ? " one" : ""}">${Object.entries(
      dc.opts
    )
      .map(
        ([
          v,
          l,
        ]) => `<div class="frame${S[dc.id] === v ? " on" : ""}" data-d="${dc.id}" data-v="${v}">
      <div class="fh"><b>${dc.id.toUpperCase()}${v} · ${esc(l)}</b><span><button type="button" data-exp>Expand</button> <button type="button" data-use>${S[dc.id] === v ? "In use" : "Use this"}</button></span></div>
      <div class="fb">${frag(C, dc.id, v)}</div>${NOTES[dc.id][v](C) ? `<div class="note">${esc(NOTES[dc.id][v](C))}</div>` : ""}</div>`
      )
      .join("")}</div></div>`
        ).join("");
        panel(C);
      }
      function panel(C) {
        const off = DECISIONS.filter((dc) => S[dc.id] !== PICK[dc.id]).map(
          (dc) => dc.id.toUpperCase() + esc(S[dc.id])
        );
        document.getElementById("twbd").innerHTML =
          `<fieldset><legend>Issue (real data)</legend><select id="isel">${D.issues
            .slice()
            .reverse()
            .map(
              (i) =>
                `<option value="${i.no}"${i.no === C.iss.no ? " selected" : ""}>Issue ${i.no} · ${fmt(i.date, true)} · ${i.new.length} new / ${i.rev.length} rev.</option>`
            )
            .join("")}</select></fieldset>` +
          DECISIONS.map(
            (dc) =>
              `<fieldset><legend>${esc(dc.name)}</legend><div class="seg">${Object.entries(
                dc.opts
              )
                .map(
                  ([v, l]) =>
                    `<label><input type="radio" name="${dc.id}" value="${v}"${S[dc.id] === v ? " checked" : ""}><span>${v}) ${esc(l)}</span></label>`
                )
                .join("")}</div></fieldset>`
          ).join("") +
          `<p class="meta" style="margin:10px 0 0;white-space:normal">Chosen: ${Object.entries(
            PICK
          )
            .map(([k, v]) => k.toUpperCase() + v)
            .join(
              " "
            )}.${off.length ? ` Trying: ${off.join(" ")}.` : ""}</p><button class="more" type="button" id="pick" style="width:100%">Show the chosen page</button><button class="more" type="button" id="reset" style="width:100%;margin-top:6px">Show today's page</button>`;
      }
      document.addEventListener("change", (e) => {
        if (e.target.id === "isel") {
          S.issue = +e.target.value;
          save();
          render();
          return;
        }
        if (e.target.name && DECISION_ID.test(e.target.name)) {
          S[e.target.name] = e.target.value;
          save();
          render();
        }
      });
      document.addEventListener("click", (e) => {
        const f = e.target.closest(".frame");
        if (e.target.matches("[data-use]") && f) {
          S[f.dataset.d] = f.dataset.v;
          save();
          render();
          document
            .getElementById("home")
            .scrollIntoView({ behavior: "smooth" });
          return;
        }
        if (e.target.matches("[data-exp]") && f) {
          f.classList.toggle("open");
          e.target.textContent = f.classList.contains("open")
            ? "Collapse"
            : "Expand";
          return;
        }
        if (e.target.matches("[data-more]")) {
          const sec = e.target.closest("section");
          const C = ctx(S.issue);
          const tmp = document.createElement("div");
          tmp.innerHTML = issueLead(C, S.d2, true);
          sec.replaceWith(tmp.firstElementChild);
          return;
        }
        if (e.target.id === "pick") {
          Object.assign(S, PICK);
          save();
          render();
          return;
        }
        if (e.target.id === "reset") {
          Object.assign(S, DEF);
          save();
          render();
          return;
        }
        if (e.target.id === "twmin") {
          const t = document.getElementById("tw");
          t.classList.toggle("min");
          document.body.classList.toggle("twmin", t.classList.contains("min"));
          e.target.textContent = t.classList.contains("min") ? "Show" : "Hide";
          e.target.setAttribute("aria-expanded", !t.classList.contains("min"));
        }
      });
      if (matchMedia("(max-width:700px)").matches) {
        document.getElementById("tw").classList.add("min");
        document.body.classList.add("twmin");
        const b = document.getElementById("twmin");
        b.textContent = "Show";
        b.setAttribute("aria-expanded", "false");
      }
      fetch("data.json")
        .then((r) => r.json())
        .then((j) => {
          Object.assign(D, j);
          render();
        })
        .catch((err) => {
          document.getElementById("home").innerHTML =
            `<p class="intro gut">Could not load data.json (${esc(err.message)}).</p>`;
        });
    })();
    </script>
  </body>
</html>
