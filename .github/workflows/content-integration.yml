name: Trusted full-content build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: content-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full:
    environment: content-integration
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CONTENT_PROFILE: full
      VERCEL_ENV: production
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Remove legacy corpus and only owned generated manifests
        run: |
          rm -rf apps/blog/src/content
          rm -f apps/blog/src/data/article-graph.json apps/blog/src/data/articles-meta.json apps/blog/src/data/articles-meta.zh-TW.json apps/blog/src/data/open-questions.json apps/blog/src/data/search-index.json apps/blog/src/data/translations.json apps/blog/src/data/wiki-sources.json
          rm -rf apps/blog/.next/cache/howardism-content
      - name: Cold full build
        run: |
          bun run build 2>&1 | tee "$RUNNER_TEMP/howardism-cold-build.log"
          cp apps/blog/public/.well-known/howardism-content.json "$RUNNER_TEMP/howardism-cold-marker.json"
      - name: Warm full build
        run: |
          bun run build 2>&1 | tee "$RUNNER_TEMP/howardism-warm-build.log"
      - name: Verify exact pair, cache behavior and deployable output
        run: |
          bun apps/cli/src/content/build-evidence.ts \
            --cold-log "$RUNNER_TEMP/howardism-cold-build.log" \
            --warm-log "$RUNNER_TEMP/howardism-warm-build.log" \
            --cold-marker "$RUNNER_TEMP/howardism-cold-marker.json" \
            --blog-root apps/blog --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/howardism-build-evidence.json"
          {
            printf '### Trusted full-content build receipt\n\n'
            printf 'Commit: %s\n\n' "$GITHUB_SHA"
            printf '```json\n'
            cat "$RUNNER_TEMP/howardism-build-evidence.json"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check prepared production inputs
        run: bun run content:validate --profile full
