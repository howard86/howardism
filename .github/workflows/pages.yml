name: GitHub Pages
# Static export of the blog on GitHub Pages: the canonical, indexed deployment
# at www.howard86.com. The Vercel export (DEPLOY_TARGET=vercel) is a noindex
# fallback. DEPLOY_TARGET=pages switches next.config.ts to `output: "export"`;
# VERCEL_ENV=production reuses the next.config.ts gate that requires the pinned
# full release, as content-integration.yml does. The R2 read credentials must
# be set on the `github-pages` environment, which secrets on other environments
# don't reach.
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_TARGET: pages
      CONTENT_PROFILE: full
      VERCEL_ENV: production
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # env.ts rejects an empty measurement ID, so export it only when the
      # repository variable is set. It must precede the build, which reads it.
      - name: Analytics ID
        env:
          GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: |
          if [ -n "$GA_MEASUREMENT_ID" ]; then
            echo "NEXT_PUBLIC_GA_MEASUREMENT_ID=$GA_MEASUREMENT_ID" >> "$GITHUB_ENV"
          fi
      # Deploys build clean: no caches.
      - uses: ./.github/actions/static-export
        with:
          target: pages
          cache: "false"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/blog/out
      - name: Wait for Pages artifact visibility
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        timeout-minutes: 3
        with:
          script: |
            // deploy-pages v5 lists this internal service; REST visibility is insufficient.
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const scope = claims.scp.split(' ').find(value => value.startsWith('Actions.Results:'));
            const parts = scope?.split(':');
            if (parts?.length !== 3 || !parts[1] || !parts[2]) {
              throw new Error('Missing artifact service backend IDs');
            }
            const url = new URL(
              '/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts',
              process.env.ACTIONS_RESULTS_URL
            );
            const body = JSON.stringify({
              workflow_run_backend_id: parts[1],
              workflow_job_run_backend_id: parts[2]
            });
            for (const delay of [0, 1, 2, 4, 8, 16, 32]) {
              if (delay) await new Promise(resolve => setTimeout(resolve, delay * 1000));
              const response = await fetch(url, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                body,
                signal: AbortSignal.timeout(10000)
              });
              if (!response.ok) throw new Error(`Artifact lookup failed: HTTP ${response.status}`);
              const data = await response.json();
              const count = (data.artifacts ?? []).filter(artifact => artifact.name === 'github-pages').length;
              if (count === 1) {
                core.info('Pages artifact is visible to the deployment service');
                return;
              }
              if (count > 1) throw new Error(`Multiple Pages artifacts found: ${count}`);
              core.info('Pages artifact is not visible yet');
            }
            throw new Error('Pages artifact remained unavailable after 7 lookups and 63 seconds of backoff');
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
