# One weekly pull request covering every bun and GitHub Actions update.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore"
      include: "scope"

updates:
  - package-ecosystem: "bun"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
