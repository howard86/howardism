name: Static export
description: Install, build, and verify the blog's static export for one deploy target.
inputs:
  target:
    description: Deploy target, `pages` or `vercel` (sets DEPLOY_TARGET).
    required: true
  cache:
    description: Restore and save the Bun install and Next.js build caches.
    default: "true"
  verify:
    description: Run pages:verify after the build.
    default: "true"
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.cache == 'true'
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.cache == 'true'
      with:
        path: apps/blog/.next/cache
        key: ${{ runner.os }}-next-${{ inputs.target }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-next-${{ inputs.target }}-${{ hashFiles('bun.lock') }}-
          ${{ runner.os }}-next-${{ inputs.target }}-
    - name: Install
      shell: bash
      run: bun install --frozen-lockfile
    - name: Static export
      shell: bash
      env:
        DEPLOY_TARGET: ${{ inputs.target }}
      run: bun run build
    - name: Redirect stubs
      if: inputs.target == 'pages'
      shell: bash
      env:
        DEPLOY_TARGET: ${{ inputs.target }}
      run: bun run --cwd apps/cli pages:redirects
    - name: Verify export
      if: inputs.verify == 'true'
      shell: bash
      env:
        DEPLOY_TARGET: ${{ inputs.target }}
      run: bun run --cwd apps/cli pages:verify
